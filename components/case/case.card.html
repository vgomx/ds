<script>
  const h = React.createElement;
  const NS = window.VitorGomesDesignSystem_32625a;
(function () {
  const { ProgressRing, SegmentedControl } = NS;
  function Demo() {
    const row = (v) => h('span', { key: v, style: { display: 'flex', alignItems: 'center', gap: 8, fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '.1em' } }, h(ProgressRing, { value: v }), v + '%');
    return h('div', { style: { display: 'flex', gap: 28, alignItems: 'center', flexWrap: 'wrap' } }, [0, 4, 34, 61, 100].map(row), h(ProgressRing, { value: 34, size: 40, strokeWidth: 1.4 }));
  }
  ReactDOM.createRoot(document.getElementById('r-ProgressRing')).render(h(Demo));
})();
(function () {
  const { SectionNav, SegmentedControl } = NS;
  function Demo() {
    const names = ['Overview','Context','Challenge','Research','Strategy','Flow','Solution','Impact','Reflection'];
    const [p, setP] = React.useState(34);
    const [mode, setMode] = React.useState('open');
    const n = names.length, idx = Math.min(n - 1, Math.floor(p / 100 * n));
    const within = Math.round((p / 100 * n - idx) * 100);
    const sections = names.map((label) => ({ id: label.toLowerCase(), label }));
    return h('div', { style: { display: 'flex', gap: 32, alignItems: 'flex-start', flexWrap: 'wrap' } },
      h(SectionNav, { sections, activeId: sections[idx].id, sectionProgress: within, progress: p, minutesLeft: Math.max(1, Math.round(18 * (1 - p / 100))), mode,
        onNavigate: (id, e) => { e.preventDefault(); setP(Math.round(names.findIndex((x) => x.toLowerCase() === id) / n * 100) + 1); } }),
      h('div', { style: { flex: '1 1 240px', display: 'flex', flexDirection: 'column', gap: 16 } },
        h(SegmentedControl, { options: [{ label: 'Open', value: 'open' }, { label: 'Collapsed', value: 'collapsed' }], value: mode, onChange: setMode }),
        h('label', { style: { fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--text-muted)' } }, 'Reading progress · ' + p + '%'),
        h('input', { type: 'range', min: 0, max: 100, value: p, onChange: (e) => setP(Number(e.target.value)), 'aria-label': 'Reading progress' }),
        h('p', { style: { fontSize: 14, lineHeight: 1.55, color: 'var(--text-secondary)', margin: 0 } }, 'Drag the slider or click a section. In a page, mode "auto" switches by viewport: open ≥1500px, collapsed 900–1499px, hidden below.')));
  }
  ReactDOM.createRoot(document.getElementById('r-SectionNav')).render(h(Demo));
})();
(function () {
  const { ReadingBar, SegmentedControl } = NS;
  function Demo() {
    return h('div', { style: { width: 320, border: '1px solid var(--border-default)', borderRadius: 'var(--radius)', overflow: 'hidden' } },
      h(ReadingBar, { section: { number: '05', label: 'Strategy' }, progress: 52, minutesLeft: 8, sticky: false }),
      h('div', { style: { padding: '16px', display: 'flex', flexDirection: 'column', gap: 8 } }, [70, 92, 84].map((w) => h('div', { key: w, style: { height: 8, width: w + '%', background: 'var(--gray-150)' } }))));
  }
  ReactDOM.createRoot(document.getElementById('r-ReadingBar')).render(h(Demo));
})();
(function () {
  const { CompareSlider, SegmentedControl } = NS;

  }
  ReactDOM.createRoot(document.getElementById('r-CompareSlider')).render(h(Demo));
})();
(function () {
  const { AnnotatedScreen, SegmentedControl } = NS;
  function Demo() {
    return h(AnnotatedScreen, { width: 280, callouts: [
      { x: 26, y: 16, title: 'One question first', body: 'Most people answer no and move on.' },
      { x: 80, y: 38, title: 'A block per country', body: 'Markers past the middle open their card on the left.' },
      { x: 30, y: 62, title: 'A branch for FATCA', body: 'The next field changes to match the ID type.' },
      { x: 50, y: 88, title: 'No duplicates', body: 'A country can only be added once.' },
    ] });
  }
  ReactDOM.createRoot(document.getElementById('r-AnnotatedScreen')).render(h(Demo));
})();
(function () {
  const { FlowDiagram, SegmentedControl } = NS;
  function Demo() {
    return h(FlowDiagram, {
      nodes: [
        { id: 'start', type: 'step', label: 'Start', x: 0, y: 60, w: 112 },
        { id: 'a', type: 'decision', label: 'Gate A?', x: 152, y: 48 },
        { id: 's1', type: 'step', label: 'Step', x: 312, y: 60 },
        { id: 'b', type: 'decision', label: 'Gate B?', x: 488, y: 48 },
        { id: 'r1', type: 'step', label: 'Route 1', x: 668, y: 20, w: 148 },
        { id: 'r2', type: 'step', label: 'Route 2', x: 668, y: 100, w: 148 },
        { id: 'done', type: 'step', label: 'Done', x: 880, y: 60, w: 112 },
        { id: 'exit', type: 'exit', label: 'Exit · hard stop', x: 148, y: 196 },
      ],
      edges: [{ from: 'start', to: 'a' }, { from: 'a', to: 's1' }, { from: 'a', to: 'exit' }, { from: 's1', to: 'b' }, { from: 'b', to: 'r1' }, { from: 'b', to: 'r2' }, { from: 'r1', to: 'done' }, { from: 'r2', to: 'done' }],
      paths: [
        { id: 'r1', label: 'Route 1', nodes: ['start', 'a', 's1', 'b', 'r1', 'done'], description: 'Passes both gates and takes the first branch.' },
        { id: 'r2', label: 'Route 2', nodes: ['start', 'a', 's1', 'b', 'r2', 'done'], description: 'Same gates, other branch.' },
        { id: 'ex', label: 'Exit at A', nodes: ['start', 'a', 'exit'], description: 'A hard stop with an explanation and a way forward.' },
      ],
    });
  }
  ReactDOM.createRoot(document.getElementById('r-FlowDiagram')).render(h(Demo));
})();

  }
  ReactDOM.createRoot(document.getElementById('r-ReframeQuote')).render(h(Demo));
})();

  ReactDOM.createRoot(document.getElementById('r-CaseNav')).render(h(Demo));
})();
(function () {

  }

})();

  }
  ReactDOM.createRoot(document.getElementById('r-Callout')).render(h(Demo));
})();
</script>
